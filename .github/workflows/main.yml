name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - run: ./autogen.sh
    - run: ./configure
    - run: make
    - run: make test
  test-macos:
    runs-on: macos-latest
    steps:
    - name: checkout
      uses: actions/checkout@v2
    - name: build
      run: |
        brew install automake
        ./autogen.sh
        CFLAGS="-Os -arch arm64 -arch x86_64" LDFLAGS="-s -arch arm64 -arch x86_64" ./configure
        make && make DESTDIR=/tmp/tinyproxy-macos-git-master install
    - name: mac pack
      run: |
        cd /tmp
        tar czf tinyproxy-macos-git-master.tar.gz tinyproxy-macos-git-master
    - name: upload mac artifact
      uses: actions/upload-artifact@v2
      with:
        name: tinyproxy-macos-git-master.tar.gz
        path: /tmp/tinyproxy-macos-git-master.tar.gz

  valgrind-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: install valgrind
      run: sudo apt-get install --assume-yes valgrind
    - run: ./autogen.sh
    - run: ./configure --enable-debug --enable-transparent --enable-reverse
    - run: make
    - run: make test
    - run: make valgrind-test
